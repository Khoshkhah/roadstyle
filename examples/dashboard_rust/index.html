<!DOCTYPE html>
<html><head><meta charset="utf-8"/>
<title>roadstyle dashboard, Rust engine</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no"/>
<!-- An example: roadstyle's dashboard modules (rust/roadstyle-assets/files/static/dashboard/) on a style that the Rust engine makes
     (rust/roadstyle-wasm) from the Monaco test data. How to build and open it: README.md in this folder. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="../../rust/roadstyle-assets/files/static/dashboard/dashboard.css">
<link rel="stylesheet" href="../../rust/roadstyle-assets/files/static/popup.css">
<style>html,body{margin:0;height:100%}#map{position:absolute;inset:0}</style>
</head><body>
<div id="map"></div>
<script type="module">
import init, {Look, inlineStyle, styleSources} from "./pkg/roadstyle_wasm.js";
import {rsDashboard} from "../../rust/roadstyle-assets/files/static/dashboard/index.js";

const DATA = "../../rust/roadstyle-rs/tests/data/";
const bytes = (u) => fetch(u).then((r) => r.arrayBuffer()).then((b) => new Uint8Array(b));
const [, roads, lookText] = await Promise.all([init(), bytes(DATA + "monaco/roads.parquet"), fetch(DATA + "look.json").then((r) => r.text())]);
// the saved look (look.json: a format to save and load, not an API to read fields from) with this page's map options, render_edges'
// keywords, each through Look.withArg
const withArgs = (look, args) => Object.entries(args).reduce((l, [k, v]) => l.withArg(k, JSON.stringify(v)), look);
// - state "live": a style for a dashboard; the dashboard takes its controls (the selection colour, the arrows' rules, ...) from the
//   style's metadata roadstyle:controls
// - the roads coloured by their lane count, as render_edges(color_by="lanes", cmap="YlOrRd", vmin=1, vmax=4): the engine writes the
//   legend data into the style's metadata roadstyle:color_options
// - levels: the stored levels' metadata, the value of roads_sql.js makeRoads for a duckOSM file: the engine checks that the levels in
//   roads.parquet were solved for these edges (their number and the hash of their ids), and stops with an error if not
const lk = withArgs(Look.fromJson(lookText), {state: "live", color_by: "lanes", cmap: "YlOrRd", vmin: 1, vmax: 4,
                                               levels: {edge_hash: "615c9155ab37a030dbfa80da2f7fcc09", n_edges: 13298}});
const style = JSON.parse(inlineStyle(roads, lk, undefined, undefined, "Monaco"));
// the road table of stage 1 (each road's fields, midpoint, bbox, heading and line, by row): the popup, the search and Street View read it
const road_table = JSON.parse(new TextDecoder().decode(styleSources(roads, lk, undefined, undefined, "Monaco").roadTable()));

const map = new maplibregl.Map({container: "map", style, attributionControl: {compact: true}});
map.addControl(new maplibregl.NavigationControl({visualizePitch: true}));
map.addControl(new maplibregl.ScaleControl({maxWidth: 120, unit: "metric"}), "bottom-left");
// the style's images (the one-way arrow): the style's metadata roadstyle:images
for (const [id, im] of Object.entries(style.metadata["roadstyle:images"] || {})) {
  map.loadImage(im.url).then((r) => map.addImage(id, r.data, {sdf: im.sdf, pixelRatio: im.pixelRatio}));
}
// the popup fields, the tooltip and the hover delay come from the style's metadata roadstyle:interaction, the legend from
// roadstyle:color_options
rsDashboard(map, {
  style,
  road_table,
  street_view: "window",
  find_control: true,
});
window.map = map;
</script>
</body></html>
