# `uvx roadstyle-mcp`: the roadstyle MCP server under its own name. No code of its own - the
# server is roadstyle.mcp_server, installed through the roadstyle[mcp] extra. MCP clients and the
# MCP Registry expect a package whose own command is the server; roadstyle's command is the CLI.
# Released together with roadstyle; its version and pin always match (tests/test_versions.py).
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roadstyle-mcp"
version = "0.11.0"
description = "MCP server for roadstyle: AI agents draw styled, interactive road maps of any place or road file"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Kaveh" }]
keywords = ["mcp", "model-context-protocol", "openstreetmap", "osmnx", "roads", "map", "ai-agents"]
dependencies = ["roadstyle[mcp]==0.11.0"]

[project.scripts]
roadstyle-mcp = "roadstyle.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Khoshkhah/roadstyle"
Documentation = "https://khoshkhah.github.io/roadstyle/guides/agents/"

[tool.setuptools]
packages = []
