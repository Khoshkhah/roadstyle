<!DOCTYPE html>
<html><head><meta charset="utf-8"/>
<title>roadstyle</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no"/>
<!-- The studio's map (index.html loads it in an iframe): MapLibre and roadstyle's dashboard, alone in their page as on a saved map. The
     studio calls window.show(...) with each new style; it loads this page again when the dashboard itself must change (the data, the
     popup mode). The roads' style is made with state "live", so the dashboard takes its options from it (roadstyle:controls). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="../../src/roadstyle/static/dashboard/dashboard.css">
<link rel="stylesheet" href="../../src/roadstyle/static/popup.css">
<style>html,body{margin:0;height:100%}#map{position:absolute;inset:0}</style>
</head><body>
<div id="map"></div>
<script type="module">
import {rsDashboard} from "../../src/roadstyle/static/dashboard/index.js";

const studio = parent.studio;                 // the studio page: its options and its engine (the tiles)
const o = studio.dashboardOptions();
// what comes from the studio page is of its window: MapLibre sends only this window's objects to its workers, so each one is copied here
maplibregl.addProtocol("rs", (p) => studio.tile(p.url).then((bytes) => ({data: new Uint8Array(bytes)})));
let map = null, rs = null, urls = [];          // urls: the Blob URLs of the last style's GeoJSON, freed with it

// the base map: the page's own source and layers (bm, basemap, bg), as roadstyle's page has them, under the roads
// TODO(R3): a copy of render_web._basemap_style. Remove it in the change that uses the page writer.
function baseStyle(){
  const bm = o.basemaps.find((b) => b.key === o.basemap) || o.basemaps[0];
  const style = {version: 8, sources: {}, layers: [{id: "bg", type: "background", paint: {"background-color": bm ? bm.bg : "#ffffff"}}]};
  if (bm && bm.tiles.length) {
    style.sources.bm = {type: "raster", tiles: bm.tiles, tileSize: 256, maxzoom: bm.maxzoom || 19, attribution: bm.attr || ""};
    style.layers.push({id: "basemap", type: "raster", source: "bm"});
  }
  return style;
}
// a roads style's sources and layers with the prefix rs- (their GeoJSON as Blob URLs, the image names too)
function prefixed(style, files){
  urls.forEach(URL.revokeObjectURL); urls = [];
  const images = Object.keys(style.metadata["roadstyle:images"] || {}), sources = {}, layers = [];
  for (const [id, src] of Object.entries(style.sources)) {
    const s = {...src};
    if (files && typeof s.data === "string") urls.push(s.data = URL.createObjectURL(new Blob([files[s.data]], {type: "application/geo+json"})));
    // the tiled style of tileSources has no promoteId yet (audit item N3): the pieces' row as their id, for the glow and the live data
    if (s.type === "vector" && !s.promoteId) s.promoteId = {simple: "__rs_edge"};
    sources["rs-" + id] = s;
  }
  for (const l of style.layers) {
    let json = JSON.stringify(l);
    for (const n of images) json = json.replaceAll(`"${n}"`, `"rs-${n}"`);     // the image names in the layout
    layers.push({...JSON.parse(json), id: "rs-" + l.id, source: "rs-" + l.source});
  }
  return {sources, layers};
}
async function addImages(style){
  for (const [id, im] of Object.entries(style.metadata["roadstyle:images"] || {}))
    if (!map.hasImage("rs-" + id)) map.addImage("rs-" + id, (await map.loadImage(im.url)).data, {sdf: im.sdf, pixelRatio: im.pixelRatio});
}

// a roads style. The first one makes the map and the dashboard (which makes its boxes from the style: the Roads box, the tunnel look,
// the views); each next one replaces the rs- sources and layers, and rs.setStyle reads it
window.show = async ({style: given, table, files, fit}) => {
  const style = JSON.parse(JSON.stringify(given));             // a copy of this window (see the protocol above)
  const own = prefixed(style, files);
  if (!map) {
    const base = baseStyle();
    // the style's glyphs and its global states' start values (state "live": the expressions read them) go with it
    map = new maplibregl.Map({container: "map", style: {...base, ...(style.glyphs ? {glyphs: style.glyphs} : {}), ...(style.state ? {state: style.state} : {}),
      sources: {...base.sources, ...own.sources}, layers: [...base.layers, ...own.layers]}, bounds: fit, maxPitch: 70, attributionControl: {compact: true}});
    window.map = map;
    map.on("styleimagemissing", () => addImages(style));
    map.addControl(new maplibregl.NavigationControl({visualizePitch: true}));
    map.addControl(new maplibregl.ScaleControl({maxWidth: 120, unit: "metric"}), "bottom-left");
    rs = window.rs = rsDashboard(map, {...o.dashboard, style, road_table: table, prefix: "rs-", basemaps: o.basemaps});
    await new Promise((ok) => map.once("load", ok));
    return;
  }
  for (const l of map.getStyle().layers) if (l.id.startsWith("rs-")) map.removeLayer(l.id);
  for (const id of Object.keys(map.getStyle().sources)) if (id.startsWith("rs-")) map.removeSource(id);
  await addImages(style);
  const now = map.getGlobalState();                            // a state this style has and the map not yet (a new overlay's rs_ov_<n>)
  for (const [k, v] of Object.entries(style.state || {})) if (!(k in now)) map.setGlobalStateProperty(k, v.default);
  for (const [id, s] of Object.entries(own.sources)) map.addSource(id, s);
  for (const l of own.layers) map.addLayer(l);
  rs.setStyle(style, {road_table: table});
  if (fit) map.fitBounds(fit, {padding: 30, duration: 0});
};
studio.previewReady();
</script>
</body></html>
