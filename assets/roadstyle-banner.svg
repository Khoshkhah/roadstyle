<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 240" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="rsOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="50%" stop-color="#FF3E3E"/>
      <stop offset="100%" stop-color="#E61C5D"/>
    </linearGradient>

    <linearGradient id="rsGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#FF9E00"/>
    </linearGradient>

    <linearGradient id="rsCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="rsTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="50%" stop-color="#FFAA00"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111728"/>
      <stop offset="100%" stop-color="#080B14"/>
    </linearGradient>

    <!-- Filters for 3D Grade Separation & Glow -->
    <filter id="bridgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="824" height="240" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Subtle Cartographic Coordinate Grid Lines -->
  <g opacity="0.06" stroke="#38BDF8" stroke-width="1" fill="none">
    <line x1="60" y1="0" x2="60" y2="240"/>
    <line x1="140" y1="0" x2="140" y2="240"/>
    <line x1="220" y1="0" x2="220" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="240"/>
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
  </g>

  <!-- Ambient Light Behind Emblem -->
  <circle cx="150" cy="120" r="90" fill="#FF5E3A" opacity="0.08" filter="url(#softGlow)"/>

  <!-- Left Side: The "R" Road Interchange Emblem (Grade Separated Casing + Fill Sandwich) -->
  <g transform="translate(18, 0)">
    <!-- GROUND ROAD 1: Tunnel/Underpass Highway (Curve curving up and right, Layer 0) -->
    <g id="underpass-road">
      <!-- Outer Casing (Dark Road Border) -->
      <path d="M 60 175 C 95 175, 130 150, 160 115 C 185 85, 205 60, 240 50" 
            fill="none" stroke="#0F172A" stroke-width="22" stroke-linecap="round"/>
      <path d="M 60 175 C 95 175, 130 150, 160 115 C 185 85, 205 60, 240 50" 
            fill="none" stroke="#1E293B" stroke-width="19" stroke-linecap="round"/>
      <!-- Inner Fill (Motorway Orange/Coral) -->
      <path d="M 60 175 C 95 175, 130 150, 160 115 C 185 85, 205 60, 240 50" 
            fill="none" stroke="url(#rsOrange)" stroke-width="13" stroke-linecap="round"/>
      <!-- Dashed White Centerline Striping -->
      <path d="M 60 175 C 95 175, 130 150, 160 115 C 185 85, 205 60, 240 50" 
            fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.9"/>
    </g>

    <!-- ELEVATED OVERPASS BRIDGE 2: The "R" Upper Loop (Layer +1, 3D Bridge with Shadow) -->
    <g id="overpass-bridge" filter="url(#bridgeShadow)">
      <!-- Bridge Structure / Concrete Deck (Extra wide shadow casing) -->
      <path d="M 85 55 L 85 185" 
            fill="none" stroke="#0A0E1A" stroke-width="24" stroke-linecap="round"/>
      <!-- Bridge Outer Casing -->
      <path d="M 85 55 L 85 185" 
            fill="none" stroke="#334155" stroke-width="20" stroke-linecap="round"/>
      <!-- Bridge Inner Fill (Vibrant Cyan / Primary Highway) -->
      <path d="M 85 55 L 85 185" 
            fill="none" stroke="url(#rsCyan)" stroke-width="14" stroke-linecap="round"/>
      <!-- Centerline -->
      <path d="M 85 58 L 85 182" 
            fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.95"/>

      <!-- Overpass Interchange Loop forming top lobe of "R" -->
      <!-- Bridge Deck Casing -->
      <path d="M 85 62 C 145 52, 195 75, 195 110 C 195 140, 150 155, 85 155" 
            fill="none" stroke="#0A0E1A" stroke-width="24" stroke-linecap="round"/>
      <path d="M 85 62 C 145 52, 195 75, 195 110 C 195 140, 150 155, 85 155" 
            fill="none" stroke="#334155" stroke-width="20" stroke-linecap="round"/>
      <!-- Loop Fill (Golden Amber Cartography) -->
      <path d="M 85 62 C 145 52, 195 75, 195 110 C 195 140, 150 155, 85 155" 
            fill="none" stroke="url(#rsGold)" stroke-width="14" stroke-linecap="round"/>
      <!-- Centerline Striping -->
      <path d="M 85 62 C 145 52, 195 75, 195 110 C 195 140, 150 155, 85 155" 
            fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.95"/>

      <!-- Lower Right "Leg" of the "R" (Highway Ramp / Flyover) -->
      <path d="M 135 145 C 160 150, 185 165, 215 185" 
            fill="none" stroke="#0A0E1A" stroke-width="22" stroke-linecap="round"/>
      <path d="M 135 145 C 160 150, 185 165, 215 185" 
            fill="none" stroke="#334155" stroke-width="18" stroke-linecap="round"/>
      <path d="M 135 145 C 160 150, 185 165, 215 185" 
            fill="none" stroke="url(#rsOrange)" stroke-width="12" stroke-linecap="round"/>
      <path d="M 135 145 C 160 150, 185 165, 215 185" 
            fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="5 5" opacity="0.9"/>
    </g>

    <!-- Cartographic Road Junction Waypoints & One-Way Arrows -->
    <circle cx="85" cy="62" r="5" fill="#FFF" filter="url(#softGlow)"/>
    <circle cx="85" cy="185" r="5" fill="#FFF" filter="url(#softGlow)"/>
    <circle cx="215" cy="185" r="5" fill="#FFD166" filter="url(#softGlow)"/>
    <circle cx="240" cy="50" r="5" fill="#FF6B35" filter="url(#softGlow)"/>
    <circle cx="60" cy="175" r="4.5" fill="#00F2FE"/>

    <!-- Directional Navigation Arrowhead on Overpass Loop -->
    <polygon points="175,100 183,110 173,114" fill="#0F172A"/>
    <polygon points="174,101 181,109 174,112" fill="#FFFFFF"/>
  </g>

  <!-- Right Side: Typography & Technology Badges -->
  <g transform="translate(290, 52)">
    <!-- Main Title: roadstyle -->
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">
      <tspan fill="#F8FAFC">road</tspan>
      <tspan fill="url(#rsTitleGrad)">style</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#94A3B8" letter-spacing="0.2">
      Opinionated road cartography &amp; interactive map styling for Python
    </text>

    <!-- Badges / Features Row -->
    <g transform="translate(2, 114)">
      <!-- Badge 1: Casing + Fill -->
      <g transform="translate(0, 0)">
        <rect width="112" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <circle cx="14" cy="13" r="4.5" fill="#FF6B35"/>
        <text x="25" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Casing + Fill</text>
      </g>

      <!-- Badge 2: 3D Bridges -->
      <g transform="translate(120, 0)">
        <rect width="108" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <circle cx="14" cy="13" r="4.5" fill="#FFD166"/>
        <text x="25" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">3D Bridges</text>
      </g>

      <!-- Badge 3: MapLibre & Folium -->
      <g transform="translate(236, 0)">
        <rect width="138" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <circle cx="14" cy="13" r="4.5" fill="#00F2FE"/>
        <text x="25" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">MapLibre • Folium</text>
      </g>

      <!-- Badge 4: Offline HTML -->
      <g transform="translate(382, 0)">
        <rect width="105" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <circle cx="14" cy="13" r="4.5" fill="#4EED97"/>
        <text x="25" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Offline HTML</text>
      </g>
    </g>
  </g>
</svg>
