<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>

    <linearGradient id="glassP1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="glassP2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="glassP3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.08"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="790" height="360" rx="16" fill="url(#bgSan)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Isometric Axis Guidelines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="3 3" opacity="0.6">
    <line x1="80" y1="260" x2="80" y2="100"/>
    <line x1="380" y1="320" x2="380" y2="160"/>
    <line x1="230" y1="200" x2="230" y2="40"/>
  </g>

  <!-- Title Top -->
  <g transform="translate(32, 40)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#F8FAFC">
      The Cartographic Geometry Sandwich
    </text>
    <text y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">
      How roadstyle orders casing, fill, and 3D bridge decks
    </text>
  </g>

  <!-- LAYER 1 (BOTTOM): Casing Sandwich Base (y offset +140) -->
  <g id="sandwich-casing" transform="translate(0, 80)">
    <polygon points="230,120 380,185 230,250 80,185" fill="url(#glassP3)" stroke="#475569" stroke-width="1.2"/>
    <text x="395" y="190" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">
      1. CASING LAYER (Dark outline, stroke-width = 1.6×)
    </text>
    <!-- Wide Road Casing Silhouette -->
    <path d="M 120 185 C 160 170, 260 210, 340 185" fill="none" stroke="#1E293B" stroke-width="26" stroke-linecap="round"/>
  </g>

  <!-- LAYER 2 (MIDDLE): Fill Color & Palettes (y offset +60) -->
  <g id="sandwich-fill" transform="translate(0, 0)">
    <polygon points="230,120 380,185 230,250 80,185" fill="url(#glassP2)" stroke="#FF6B35" stroke-width="1.5"/>
    <text x="395" y="190" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#FF6B35">
      2. FILL LAYER (Data-driven palette, motorway/primary)
    </text>
    <!-- Road Fill Line -->
    <path d="M 120 185 C 160 170, 260 210, 340 185" fill="none" stroke="#FF6B35" stroke-width="16" stroke-linecap="round"/>
    <path d="M 120 185 C 160 170, 260 210, 340 185" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 6" opacity="0.9"/>
  </g>

  <!-- LAYER 3 (TOP): 3D Elevated Bridge Deck (y offset -80) -->
  <g id="sandwich-bridge" transform="translate(0, -80)">
    <polygon points="230,120 380,185 230,250 80,185" fill="url(#glassP1)" stroke="#00F2FE" stroke-width="1.8"/>
    <text x="395" y="190" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#38BDF8">
      3. 3D BRIDGE DECKS (Grade separation layer &gt; 0)
    </text>
    <!-- Elevated Bridge Crossing Over with Glow -->
    <path d="M 230 135 L 230 235" fill="none" stroke="#0F172A" stroke-width="22" stroke-linecap="round"/>
    <path d="M 230 135 L 230 235" fill="none" stroke="#00F2FE" stroke-width="14" stroke-linecap="round" filter="url(#softGlow)"/>
    <path d="M 230 138 L 230 232" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="5 5"/>
  </g>
</svg>
