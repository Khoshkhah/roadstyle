<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial -->
    <radialGradient id="iconBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070A12"/>
    </radialGradient>

    <!-- Theme Gradients -->
    <linearGradient id="rsOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="50%" stop-color="#FF3E3E"/>
      <stop offset="100%" stop-color="#E61C5D"/>
    </linearGradient>

    <linearGradient id="rsGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#FF9E00"/>
    </linearGradient>

    <linearGradient id="rsCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>

    <!-- 3D Shadow for Bridge Grade Separation -->
    <filter id="bridgeShadowLarge" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="6" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="ambientLight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#iconBg)" stroke="#334155" stroke-width="2.5"/>
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#FF6B35" stroke-width="1.2" opacity="0.3"/>

  <!-- Cartographic Coordinate Grid -->
  <g opacity="0.07" stroke="#38BDF8" stroke-width="1.5" fill="none">
    <line x1="128" y1="20" x2="128" y2="492"/>
    <line x1="256" y1="20" x2="256" y2="492"/>
    <line x1="384" y1="20" x2="384" y2="492"/>
    <line x1="20" y1="128" x2="492" y2="128"/>
    <line x1="20" y1="256" x2="492" y2="256"/>
    <line x1="20" y1="384" x2="492" y2="384"/>
    <circle cx="256" cy="256" r="160"/>
  </g>

  <!-- Ambient Light Center -->
  <circle cx="260" cy="230" r="130" fill="#FF6B35" opacity="0.08" filter="url(#ambientLight)"/>

  <!-- The "R" Road Interchange Emblem (Centered around 256, 230) -->
  <g id="interchange-mark" transform="translate(42, 10)">
    <!-- GROUND LEVEL ROAD (Tunnel/Underpass curve passing beneath) -->
    <g id="underpass">
      <!-- Ground Casing -->
      <path d="M 60 310 C 120 310, 180 270, 235 200 C 275 145, 310 110, 360 90" 
            fill="none" stroke="#090D16" stroke-width="36" stroke-linecap="round"/>
      <path d="M 60 310 C 120 310, 180 270, 235 200 C 275 145, 310 110, 360 90" 
            fill="none" stroke="#1E293B" stroke-width="30" stroke-linecap="round"/>
      <!-- Ground Fill (Motorway Orange) -->
      <path d="M 60 310 C 120 310, 180 270, 235 200 C 275 145, 310 110, 360 90" 
            fill="none" stroke="url(#rsOrange)" stroke-width="20" stroke-linecap="round"/>
      <!-- Dashed White Centerline -->
      <path d="M 60 310 C 120 310, 180 270, 235 200 C 275 145, 310 110, 360 90" 
            fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-dasharray="9 9" opacity="0.95"/>
    </g>

    <!-- 3D ELEVATED OVERPASS BRIDGE (The vertical spine and upper loop forming "R") -->
    <g id="overpass" filter="url(#bridgeShadowLarge)">
      <!-- Bridge Vertical Spine Deck (Left leg of "R") -->
      <path d="M 110 90 L 110 330" 
            fill="none" stroke="#0A0E1A" stroke-width="38" stroke-linecap="round"/>
      <path d="M 110 90 L 110 330" 
            fill="none" stroke="#334155" stroke-width="32" stroke-linecap="round"/>
      <path d="M 110 90 L 110 330" 
            fill="none" stroke="url(#rsCyan)" stroke-width="22" stroke-linecap="round"/>
      <path d="M 110 95 L 110 325" 
            fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-dasharray="9 9" opacity="0.95"/>

      <!-- Overpass Loop (Top lobe of "R") -->
      <path d="M 110 100 C 210 85, 290 120, 290 180 C 290 230, 215 255, 110 255" 
            fill="none" stroke="#0A0E1A" stroke-width="38" stroke-linecap="round"/>
      <path d="M 110 100 C 210 85, 290 120, 290 180 C 290 230, 215 255, 110 255" 
            fill="none" stroke="#334155" stroke-width="32" stroke-linecap="round"/>
      <path d="M 110 100 C 210 85, 290 120, 290 180 C 290 230, 215 255, 110 255" 
            fill="none" stroke="url(#rsGold)" stroke-width="22" stroke-linecap="round"/>
      <path d="M 110 100 C 210 85, 290 120, 290 180 C 290 230, 215 255, 110 255" 
            fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-dasharray="9 9" opacity="0.95"/>

      <!-- Lower Diagonal Leg of the "R" (Flyover exit ramp) -->
      <path d="M 190 240 C 230 250, 270 275, 320 330" 
            fill="none" stroke="#0A0E1A" stroke-width="36" stroke-linecap="round"/>
      <path d="M 190 240 C 230 250, 270 275, 320 330" 
            fill="none" stroke="#334155" stroke-width="30" stroke-linecap="round"/>
      <path d="M 190 240 C 230 250, 270 275, 320 330" 
            fill="none" stroke="url(#rsOrange)" stroke-width="20" stroke-linecap="round"/>
      <path d="M 190 240 C 230 250, 270 275, 320 330" 
            fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-dasharray="8 8" opacity="0.95"/>
    </g>

    <!-- Junction Vertices & Glowing Terminus Nodes -->
    <circle cx="110" cy="90" r="8" fill="#FFF" filter="url(#softGlow)"/>
    <circle cx="110" cy="330" r="8" fill="#00F2FE" filter="url(#softGlow)"/>
    <circle cx="320" cy="330" r="8" fill="#FF6B35" filter="url(#softGlow)"/>
    <circle cx="360" cy="90" r="8" fill="#FFD166" filter="url(#softGlow)"/>
    <circle cx="60" cy="310" r="7" fill="#00F2FE"/>

    <!-- Directional Navigation Arrow on Highway Curve -->
    <polygon points="255,165 270,180 255,188" fill="#0A0E1A"/>
    <polygon points="254,167 266,179 256,185" fill="#FFFFFF"/>
  </g>

  <!-- Bottom Typography: roadstyle -->
  <g transform="translate(256, 442)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5">
      <tspan fill="#F8FAFC">road</tspan>
      <tspan fill="url(#rsOrange)">style</tspan>
    </text>
  </g>
</svg>
