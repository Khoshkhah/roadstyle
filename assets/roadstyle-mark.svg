<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380" width="100%" height="100%">
  <defs>
    <!-- Theme Gradients -->
    <linearGradient id="rsOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="50%" stop-color="#FF3E3E"/>
      <stop offset="100%" stop-color="#E61C5D"/>
    </linearGradient>

    <linearGradient id="rsGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#FF9E00"/>
    </linearGradient>

    <linearGradient id="rsCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>

    <!-- 3D Shadow for Bridge Grade Separation -->
    <filter id="bridgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="5" dy="14" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g id="interchange-mark" transform="translate(10, 15)">
    <!-- GROUND LEVEL ROAD (Tunnel/Underpass curve) -->
    <g id="underpass">
      <path d="M 60 290 C 120 290, 180 250, 235 180 C 275 125, 310 90, 360 70" 
            fill="none" stroke="#090D16" stroke-width="36" stroke-linecap="round"/>
      <path d="M 60 290 C 120 290, 180 250, 235 180 C 275 125, 310 90, 360 70" 
            fill="none" stroke="#1E293B" stroke-width="30" stroke-linecap="round"/>
      <path d="M 60 290 C 120 290, 180 250, 235 180 C 275 125, 310 90, 360 70" 
            fill="none" stroke="url(#rsOrange)" stroke-width="20" stroke-linecap="round"/>
      <path d="M 60 290 C 120 290, 180 250, 235 180 C 275 125, 310 90, 360 70" 
            fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-dasharray="9 9" opacity="0.95"/>
    </g>

    <!-- 3D ELEVATED OVERPASS BRIDGE (The vertical spine and upper loop forming "R") -->
    <g id="overpass" filter="url(#bridgeShadow)">
      <!-- Bridge Vertical Spine Deck -->
      <path d="M 110 70 L 110 310" 
            fill="none" stroke="#0A0E1A" stroke-width="38" stroke-linecap="round"/>
      <path d="M 110 70 L 110 310" 
            fill="none" stroke="#334155" stroke-width="32" stroke-linecap="round"/>
      <path d="M 110 70 L 110 310" 
            fill="none" stroke="url(#rsCyan)" stroke-width="22" stroke-linecap="round"/>
      <path d="M 110 75 L 110 305" 
            fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-dasharray="9 9" opacity="0.95"/>

      <!-- Overpass Loop (Top lobe of "R") -->
      <path d="M 110 80 C 210 65, 290 100, 290 160 C 290 210, 215 235, 110 235" 
            fill="none" stroke="#0A0E1A" stroke-width="38" stroke-linecap="round"/>
      <path d="M 110 80 C 210 65, 290 100, 290 160 C 290 210, 215 235, 110 235" 
            fill="none" stroke="#334155" stroke-width="32" stroke-linecap="round"/>
      <path d="M 110 80 C 210 65, 290 100, 290 160 C 290 210, 215 235, 110 235" 
            fill="none" stroke="url(#rsGold)" stroke-width="22" stroke-linecap="round"/>
      <path d="M 110 80 C 210 65, 290 100, 290 160 C 290 210, 215 235, 110 235" 
            fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-dasharray="9 9" opacity="0.95"/>

      <!-- Lower Diagonal Leg of the "R" (Flyover exit ramp) -->
      <path d="M 190 220 C 230 230, 270 255, 320 310" 
            fill="none" stroke="#0A0E1A" stroke-width="36" stroke-linecap="round"/>
      <path d="M 190 220 C 230 230, 270 255, 320 310" 
            fill="none" stroke="#334155" stroke-width="30" stroke-linecap="round"/>
      <path d="M 190 220 C 230 230, 270 255, 320 310" 
            fill="none" stroke="url(#rsOrange)" stroke-width="20" stroke-linecap="round"/>
      <path d="M 190 220 C 230 230, 270 255, 320 310" 
            fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-dasharray="8 8" opacity="0.95"/>
    </g>

    <!-- Junction Nodes -->
    <circle cx="110" cy="70" r="8" fill="#FFF" filter="url(#softGlow)"/>
    <circle cx="110" cy="310" r="8" fill="#00F2FE" filter="url(#softGlow)"/>
    <circle cx="320" cy="310" r="8" fill="#FF6B35" filter="url(#softGlow)"/>
    <circle cx="360" cy="70" r="8" fill="#FFD166" filter="url(#softGlow)"/>
    <circle cx="60" cy="290" r="7" fill="#00F2FE"/>

    <!-- Directional Arrowhead -->
    <polygon points="255,145 270,160 255,168" fill="#0A0E1A"/>
    <polygon points="254,147 266,159 256,165" fill="#FFFFFF"/>
  </g>
</svg>
