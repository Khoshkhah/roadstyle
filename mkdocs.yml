site_name: roadstyle
site_description: Road maps for Python - styled, interactive, offline HTML maps of road networks, with Google Street View and a JavaScript API
site_url: https://khoshkhah.github.io/roadstyle/
repo_url: https://github.com/Khoshkhah/roadstyle
repo_name: Khoshkhah/roadstyle

theme:
  name: material
  logo: img/logo.svg
  favicon: img/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Get started: get-started.md
  - Guides:
      - guides/index.md
      - Style the roads: guides/style.md
      - Colour by your data: guides/colour.md
      - Which road is on top: guides/levels.md
      - Roads from OpenStreetMap: guides/osmnx.md
      - Add your own layers: guides/overlays.md
      - Google Street View: guides/street-view.md
      - Google 3D: guides/google-3d.md
      - Set up a Google key: guides/google-key.md
      - Big networks: guides/big-networks.md
      - Dashboards & JavaScript: guides/dashboards.md
      - Dashboard layout: guides/dashboard-layout.md
      - Add to the panel: guides/dashboard-panel.md
      - Dashboard parts: guides/dashboard-parts.md
      - "Live data: a new day": guides/live-data.md
      - Move a dashboard to the new version: guides/migrating-dashboard.md
      - Put it on a website: guides/website.md
      - AI agents: guides/agents.md
  - Gallery: gallery.md
  - Live map: maps/live.html
  - Reference:
      - Every parameter: reference/parameters.md
      - JavaScript API: reference/javascript.md
      - Interaction contract: reference/contract.md
      - Inputs and outputs: reference/formats.md
      - Settings & palettes: reference/settings.md
      - Command line: reference/cli.md
  - Rust engine:
      - rust/index.md
      - "Tutorial: your first map": rust/first-map.md
      - How-to guides:
          - Use it in the browser: rust/browser.md
          - Tiles and PMTiles: rust/tiles.md
          - The roadstyle program: rust/cli.md
          - Build from source: rust/build.md
      - Explanation:
          - Architecture of the Rust version: rust/architecture.md
          - How a map is drawn: rust/drawing.md
          - How the levels are solved: rust/levels-solver.md
          - "Tiling: one algorithm and one protocol": design/tiling.md
  - Studio: studio.md

# Old pages; keep their URLs working.
plugins:
  - search
  - redirects:
      redirect_maps:
        usage.md: get-started.md
        tutorial.md: get-started.md
        examples.md: get-started.md
        manual.md: get-started.md
        frontend.md: guides/website.md
        embedding.md: guides/website.md
        comparison.md: index.md
        engines.md: guides/big-networks.md
        api.md: reference/parameters.md
        parameters.md: reference/parameters.md
        web-backend.md: reference/javascript.md
        palettes.md: reference/settings.md
        street-view.md: guides/street-view.md
        rust/crates.md: rust/architecture.md

# docs/rust/architecture.md: its tables of crates, modules and design gaps, made from the code at each build
hooks:
  - docs/gen_architecture.py
  - docs/gen_formats.py            # docs/reference/formats.md: the keys of the bundled profile and palette

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:            # ```mermaid blocks become diagrams (Material loads Mermaid)
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
