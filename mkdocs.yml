site_name: roadstyle
site_description: Road maps for Python - styled, interactive, offline HTML maps of road networks, with Google Street View and a JavaScript API
site_url: https://khoshkhah.github.io/roadstyle/
repo_url: https://github.com/Khoshkhah/roadstyle
repo_name: Khoshkhah/roadstyle

theme:
  name: material
  logo: img/logo.svg
  favicon: img/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/testbed.js

nav:
  - Home: index.md
  - Get started: get-started.md
  - Maps:
      - Style the roads: guides/style.md
      - Colour by your data: guides/colour.md
      - Which road is on top: guides/levels.md
      - Add your own layers: guides/overlays.md
      - Roads from OpenStreetMap: guides/osmnx.md
      - Big networks: guides/big-networks.md
      - "Studio: maps with no code": studio.md
  - Street View and 3D:
      - "Street View: Google, Panoramax, Mapillary": guides/street-view.md
      - How the height of a 3D bridge is calculated: guides/bridge-height.md
      - Google 3D: guides/google-3d.md
      - Keys and tokens: guides/google-key.md
  - Dashboards:
      - Dashboards: guides/dashboards.md
      - Layout and toolbox: guides/dashboard-layout.md
      - Dashboard parts: guides/dashboard-parts.md
      - JavaScript: guides/dashboard-manual/javascript.md
      - Editors and tools:
          - Edit the design of a map: guides/design-panel.md
          - Edit the levels: guides/level-editor.md
          - The data dock: guides/data-dock.md
          - Ask: guides/ask.md
  - Use it elsewhere:
      - On a website or in a map app: guides/website.md
      - With AI agents: guides/agents.md
  - Gallery:
      - gallery.md
      - Live map: maps/live.html
  - Reference:
      - Every parameter: reference/parameters.md
      - JavaScript API: reference/javascript.md
      - Interaction contract: reference/contract.md
      - Inputs and outputs: reference/formats.md
      - Settings & palettes: reference/settings.md
      - Command line: reference/cli.md
      - What is new: whats-new.md
      - Move a dashboard to the new version: guides/migrating-dashboard.md
  - Rust engine:
      - rust/index.md
      - "Tutorial: your first map": rust/first-map.md
      - How-to guides:
          - Use it in the browser: rust/browser.md
          - Tiles and PMTiles: rust/tiles.md
          - The roadstyle program: rust/cli.md
      - Explanation:
          - Architecture of the Rust version: rust/architecture.md
          - How a map is drawn: rust/drawing.md
          - How the levels are solved: rust/levels-solver.md

# Old pages; keep their URLs working.
# the design notes, the audits, the proposals and the build of the code stay in the repository, not on the site
exclude_docs: |
  /design/
  /rust/build.md

plugins:
  - search
  - redirects:
      redirect_maps:
        usage.md: get-started.md
        tutorial.md: get-started.md
        examples.md: get-started.md
        manual.md: get-started.md
        frontend.md: guides/website.md
        embedding.md: guides/website.md
        comparison.md: index.md
        engines.md: guides/big-networks.md
        api.md: reference/parameters.md
        parameters.md: reference/parameters.md
        web-backend.md: reference/javascript.md
        palettes.md: reference/settings.md
        street-view.md: guides/street-view.md
        rust/crates.md: rust/architecture.md
        guides/dashboard-panel.md: guides/dashboards.md
        guides/dashboard-manual/index.md: guides/dashboards.md
        guides/dashboard-manual/python.md: guides/dashboards.md
        guides/live-data.md: guides/dashboard-manual/javascript.md
        guides/charts.md: guides/dashboard-parts.md

# docs/rust/architecture.md: its tables of crates, modules and design gaps, made from the code at each build
hooks:
  - docs/gen_architecture.py
  - docs/gen_formats.py            # docs/reference/formats.md: the keys of the bundled profile and palette
  - docs/copy_parts.py             # site/parts/: the real dashboard files for the live parts (docs/parts/gallery.html)

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true   # the wrapper of a block gets language-<name>: javascripts/testbed.js finds the javascript blocks
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:            # ```mermaid blocks become diagrams (Material loads Mermaid)
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
