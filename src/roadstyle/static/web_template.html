<!DOCTYPE html><html><head><meta charset="utf-8"/>
<title>__TITLE__</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no"/>
<style>__MAPLIBRE_CSS__</style>
<script>__MAPLIBRE_JS__</script>
<script>__RS_TILES__</script>
<style>html,body{margin:0;height:100%}#map{position:absolute;inset:0}
__DASHBOARD_CSS__
__POPUP_CSS__
</style></head><body>
<div id="map"></div>__HOST_PANEL_HTML__<script>
__POPUP_JS__
__DASHBOARD_JS__
// the page: its map, and roadstyle's dashboard on it (static/dashboard/, docs/design/dashboard_module.md). Each option has the name of
// render's keyword; render_web.render fills in the values.
{
const style = __STYLE__;
const map = new maplibregl.Map({container:"map", style:style, center:__CENTER__, zoom:13,
  pitch:__PITCH__, bearing:__BEARING__, maxPitch:__MAX_PITCH__,
  attributionControl:{compact:true}});
// One tile zoom on the whole screen. In a tilted view MapLibre loads the near tiles at a higher zoom than the far ones. A width that
// depends on the zoom AND on the feature is baked per tile for [tile zoom, tile zoom + 1] and clamped there, so every road changed
// width where two tile zooms met (a horizontal line across the map). With one tile zoom the bake is exact on the whole screen.
// It does nothing up to 60 degrees of tilt (MapLibre uses one tile zoom there); above it, it loads more tiles (2 to 3.6 times as many at 66 to 70 degrees).
function _flatTiles(){ Object.keys(style.sources).forEach(id=>{ const s=map.getSource(id); if(s && s.type!=="raster") s.calculateTileZoom=z=>z; }); }
map.on("styledata", _flatTiles);
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}));
map.addControl(new maplibregl.ScaleControl({maxWidth:120, unit:"metric"}), "bottom-left");
rsDashboard(map, {
  style: style,
  basemaps: __BASEMAPS__,
  basemap_switcher: __BM_SWITCHER__,
  tiles: __RS_TILED__,
  simple: __RS_LEAN__,
  sources: __RS_SOURCES__,
  arrows: __RS_ARROWS__,
  live: __RS_LIVE__,
  popup_mode: __ROAD_POPUP_MODE__,
  find_control: __FIND_CONTROL__,
  zoom_readout: __ZOOM_READOUT__,
  pitch_3d: __PITCH3D__,
  street_view: __STREET_VIEW__,
  street_view_key: __SV_WINDOW_KEY__,
  google_3d: __GOOGLE_3D__,
  select_color: __SELECT_COLOR__,
  filter: __FILTER__,
  color_options: __COLOR_OPTIONS__,
  color_active: __CO_ACTIVE__,
  overlays: __OVERLAYS__,
  overlay_control: __OVERLAY_CONTROL__,
  overlay_popup: __OVERLAY_POPUP__,
  tunnel: __TUNNEL__,
  fill_layers: __RS_FILL_LAYERS__,
  road_fill: __RS_ROAD_FILL__,
  views: __VIEWS__,
  items: __ROAD_ITEMS__,
  road_popup: __ROAD_POPUP__,
  road_tooltip: __ROAD_TOOLTIP__,
  hover_delay_ms: __HOVER_DELAY_MS__,
  edge_id_col: __EDGE_ID_COL__,
  arrow_icon: __ARROW_ICON__,
  arrow_color: __ARROW_COLOR__,
  arrow_rules: __ARROW_RULES__,
});
// Self-diagnosis: a map with zero road features is a broken page, not an empty area — say WHY
// on the map itself (frontends like notebook webviews surface no console). Amber banner reports
// the inflate state so a screenshot alone pinpoints the failing stage.
map.on("load", function(){ var tries=0; (function check(){ setTimeout(function(){
  try{
    var s = _src("simple"), n;   // the role that draws the roads
    if(!s) n = 0;
    else if(s.sourceLayer){ n = map.querySourceFeatures(s.source, {sourceLayer:s.sourceLayer}).length; }
    else{
      n = _sfeats(s.source).length; }
    if(n) return;
    if(RS_TILED && ++tries < 3) return check();          // tiles may still be decoding/loading
    var st = RS_TILED
      ? (window.__rs_tiles ? JSON.stringify(window.__rs_tiles) : "tiles setup did not run")
      : (window.__rs_gz ? JSON.stringify(window.__rs_gz) : "inflate script did not run");
    document.body.insertAdjacentHTML("afterbegin",
      '<div id="rs-diag" style="position:fixed;z-index:9999;top:0;left:0;right:0;padding:8px 12px;'+
      'background:#b45309;color:#fff;font:12px monospace">roadstyle: 0 road features — '+st+
      ' | DecompressionStream: '+(typeof DecompressionStream)+'</div>');
  }catch(e){}
}, 2500); })(); });
map.on("load", ()=>{ try{ map.fitBounds(__BOUNDS__,
  {padding:30, duration:0, pitch:__PITCH__, bearing:__BEARING__}); }catch(e){} });
window.map = map;
}
</script></body></html>
