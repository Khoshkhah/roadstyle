<!-- roadstyle street-view panel: Google Street View beside the map, following the clicked road.
     Injected at the end of the page by rs.render_street_view(); talks to the map only through the public
     API (the rs:select event). Plain HTML/CSS/JS: copy it out with rs.sidebar_html("street_view"). -->
<style>
  body { --sv-w: 42%; --rs-side: var(--sv-w); }  /* --rs-side shifts the map's right-anchored controls */
  #map { right: var(--sv-w); }
  #sv { position: fixed; top: 0; right: 0; bottom: 0; width: var(--sv-w); display: flex;
        flex-direction: column; background: #fff; border-left: 1px solid #ddd;
        font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #222; }
  /* ONE row: title · road name, then the step buttons */
  #sv-bar { display: flex; align-items: center; gap: 8px; padding: 5px 8px 5px 12px;
            border-bottom: 1px solid #e5e5e5; white-space: nowrap; }
  #sv h2 { margin: 0; font-size: 13px; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
  #sv-road { flex: 1 1 0; min-width: 0; color: #555; overflow: hidden; text-overflow: ellipsis; }
  #sv-road::before { content: "\00b7"; margin-right: 8px; color: #aaa; }
  .sv-step { border: 1px solid #ccc; background: #fff; border-radius: 4px; padding: 1px 7px; cursor: pointer; }
  .sv-step:disabled { opacity: .35; cursor: default; }
  /* the flip, with a key only: Linked (the marker walks with the viewer) or Classic (the embed) */
  .sv-mode { display: inline-flex; border: 1px solid #ccc; border-radius: 4px; overflow: hidden; flex: 0 0 auto; }
  .sv-mode button { border: 0; background: #fff; padding: 1px 8px; cursor: pointer; font: inherit; font-size: 12px; color: #475569; }
  .sv-mode button.on { background: #0E7F91; color: #fff; }
  #sv [hidden] { display: none !important; }
  /* the divider: drag it to share the width (or, below, the height) between map and Street View */
  #sv-drag { position: fixed; top: 0; bottom: 0; right: var(--sv-w); width: 10px; margin-right: -5px;
             cursor: col-resize; z-index: 5; touch-action: none; }
  #sv-drag::after { content: ""; position: absolute; top: 50%; left: 3px; width: 4px; height: 40px;
                    margin-top: -20px; border-radius: 2px; background: #bbb; }
  #sv-drag:hover::after, body.sv-dragging #sv-drag::after { background: #1a6bd6; }
  body.sv-dragging { cursor: col-resize; user-select: none; }
  body.sv-dragging #sv-frame, body.sv-dragging #sv-pano { pointer-events: none; }  /* else the panel swallows the drag */
  #sv-frame, #sv-pano { flex: 1; width: 100%; border: 0; background: #eee; }
  #sv-empty { flex: 1; display: flex; flex-direction: column; align-items: center;
              justify-content: center; gap: 8px; color: #777; background: #f4f4f4;
              padding: 20px; text-align: center; }
  #sv-empty code { background: #e6e6e6; padding: 2px 5px; border-radius: 3px; color: #333; }
  /* layout="below": the map on top, Street View under it, the divider between them */
  body.sv-below { --rs-side: 0px; }
  body.sv-below #map { right: 0; bottom: var(--sv-w); }
  body.sv-below .bm-icon { bottom: calc(var(--sv-w) + 44px); }
  body.sv-below .bm-menu { bottom: calc(var(--sv-w) + 84px); }
  body.sv-below .rs-zoom { bottom: calc(var(--sv-w) + 10px); }
  body.sv-below .rs-tl { max-height: calc(100% - var(--sv-w) - 20px); }  /* the filter stays on the map */
  body.sv-below #sv { top: auto; left: 0; width: auto; height: var(--sv-w);
                         border-left: 0; border-top: 1px solid #ddd; }
  body.sv-below #sv-drag { top: auto; left: 0; right: 0; bottom: var(--sv-w); width: auto;
                              height: 10px; margin: 0 0 -5px 0; cursor: row-resize; }
  body.sv-below #sv-drag::after { top: 3px; left: 50%; width: 40px; height: 4px; margin: 0 0 0 -20px; }
  body.sv-below.sv-dragging { cursor: row-resize; }
  @media (max-width: 520px) {          /* phones only: Street View under the map, not beside it.
                                          Not 700: a docs page's text column is ~690 px */
    #map { right: 0; bottom: 45%; }
    body { --rs-side: 0px; }
    .bm-icon { bottom: calc(45% + 44px); }
    .bm-menu { bottom: calc(45% + 84px); }
    .rs-zoom { bottom: calc(45% + 10px); }
    .rs-tl { max-height: calc(55% - 20px); }
    #sv { top: 55%; width: 100%; border-left: 0; border-top: 1px solid #ddd; }
    #sv-drag { display: none; }
  }
</style>
<div id="sv-drag" title="Drag to resize"></div>
<div id="sv" data-layout="beside">
  <div id="sv-bar"><h2>Roads and Street View</h2><span id="sv-road">Click a road to see it in Street View.</span>
    <span class="sv-mode" hidden><button type="button" data-m="linked" title="The map marker walks and turns with you; Google's street photos only">Linked</button><button type="button" data-m="classic" title="Google's plain Street View: the marker stays where you clicked">Classic</button></span>
    <button type="button" class="sv-step" data-step="-15" title="Back 15 m along the road" disabled>&#9664;</button>
    <button type="button" class="sv-step" data-step="15" title="Forward 15 m along the road" disabled>&#9654;</button></div>
  <div id="sv-empty">Street View opens here, looking the way the clicked road runs.</div>
  <iframe id="sv-frame" title="Google Street View" hidden allowfullscreen></iframe>
  <div id="sv-pano" hidden></div>
</div>
<script>
(function () {
  // Google won't frame the detail.streetView URL, so build its embeddable twin (the form of
  // Google's own "Share > Embed a map": no key, but not a documented API). With a Maps Embed API
  // key, the official one is:
  //   "https://www.google.com/maps/embed/v1/streetview?key=KEY&location=" + lat + "," + lng + "&heading=" + h
  const embed = (lat, lng, h) =>
    "https://www.google.com/maps/embed?pb=!6m7!1m6!2m2!1d" + lat + "!2d" + lng + "!3f" + h + "!4f0!5f1";
  // WITH A MAPS JAVASCRIPT API KEY (street_view_key=) the panel is a real panorama instead of the
  // embed: it reports every step and turn, so the map marker walks and turns with the viewer, and
  // it asks for Google's own street imagery only - the embed also shows people's indoor photos
  const GKEY = __SV_KEY__;
  let pano = null, svc = null, loading = null, lastUrl = null, lastAt = {atStart: false, atEnd: false};
  const MODE_KEY = "rs-street-view-mode";
  let mode = "classic";
  if (GKEY) { mode = "linked"; try { mode = localStorage.getItem(MODE_KEY) || "linked"; } catch (err) {} }
  const flip = document.querySelector(".sv-mode");
  if (GKEY) {
    flip.hidden = false;
    const mark = () => flip.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.m === mode));
    mark();
    flip.querySelectorAll("button").forEach(b => b.onclick = () => {
      if (b.dataset.m === mode) return;
      mode = b.dataset.m; mark();
      try { localStorage.setItem(MODE_KEY, mode); } catch (err) {}
      if (mode === "classic") { document.getElementById("sv-pano").hidden = true; rsSetStreetViewMarkerAt(null); }
      // THE SAME SPOT in the other panel - where the viewer has walked to, which is where the
      // marker stands: a zero step re-reads it and shows it (rs:streetviewmove)
      if (!rsStreetViewStep(0) && lastUrl) show(lastUrl, lastAt);
    });
  }
  const pdiv = document.getElementById("sv-pano");
  const gload = () => loading || (loading = new Promise((ok, no) => {
    window.__rsSvReady = ok;
    const s = document.createElement("script");
    s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(GKEY) + "&v=weekly&loading=async&callback=__rsSvReady";
    s.async = true; s.onerror = no; document.head.appendChild(s);
  }));
  function panoAt(lat, lng, h) {
    return gload().then(() => {
      const g = google.maps;
      if (!pano) {
        pano = new g.StreetViewPanorama(pdiv, {motionTracking: false, addressControl: true, fullscreenControl: true});
        svc = new g.StreetViewService();
        const report = () => { const p = pano.getPosition(); if (p) rsSetStreetViewMarkerAt(p.lng(), p.lat(), pano.getPov().heading); };
        pano.addListener("position_changed", report); pano.addListener("pov_changed", report);
      }
      return svc.getPanorama({location: {lat: +lat, lng: +lng}, radius: 50, preference: g.StreetViewPreference.NEAREST,
                              sources: [g.StreetViewSource.GOOGLE]}).then(r => {
        pano.setPano(r.data.location.pano); pano.setPov({heading: +h || 0, pitch: 0}); pano.setVisible(true);
        pdiv.hidden = false; empty.hidden = true;
      }, () => { pdiv.hidden = true; empty.hidden = false; empty.textContent = "No street photos within 50 m of this spot."; });
    });
  }
  const below = document.getElementById("sv").dataset.layout === "below";
  if (below) document.body.classList.add("sv-below");
  const road = document.getElementById("sv-road"), frame = document.getElementById("sv-frame"),
        empty = document.getElementById("sv-empty");
  // Google's embed stays grey in a page opened from disk (file://): say how to serve it instead
  const fromDisk = location.protocol === "file:";
  const esc = t => String(t).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
  const serveHelp = () => {
    const file = esc(decodeURIComponent(location.pathname.split("/").pop()));
    return "<b>Street View needs this page served, not opened from disk.</b>" +
      "<span>In its folder run <code>python -m http.server</code>, then open " +
      "<code>http://localhost:8000/" + file + "</code></span>";
  };
  if (fromDisk) empty.innerHTML = serveHelp();

  const steps = [...document.querySelectorAll(".sv-step")];
  steps.forEach(b => { b.onclick = () => rsStreetViewStep(+b.dataset.step); });
  const ends = (a, z) => { steps[0].disabled = !!a; steps[1].disabled = !!z; };
  rsSetStreetViewMarker(true);                           // the map marks where Street View stands
  document.addEventListener("rs:streetviewmove", e => show(e.detail.streetView, e.detail));
  document.addEventListener("rs:select", function (e) {
    const d = e.detail, p = d.properties || {};
    if (d.overlay) return;                               // roads only (overlay clicks set .overlay)
    road.textContent = p.name || p.highway || "Unnamed road";
    show(d.streetView, {atStart: false, atEnd: false});
  });
  function show(url, at) {
    lastUrl = url; lastAt = at;
    ends(!url || at.atStart, !url || at.atEnd);
    const d = {streetView: url};
    if (!d.streetView) {                                 // street_view=False, or no geometry
      frame.hidden = true; empty.hidden = false;
      empty.textContent = "No Street View for this road.";
      return;
    }
    if (fromDisk) {                                      // no embed from file://; a link instead
      frame.hidden = true; empty.hidden = false;
      empty.innerHTML = serveHelp() + '<a href="' + esc(d.streetView) +
        '" target="_blank" rel="noopener">Or open this spot in Google Street View &#8599;</a>';
      return;
    }
    const u = new URL(d.streetView);
    const [lat, lng] = u.searchParams.get("viewpoint").split(",");
    if (GKEY && mode === "linked") {                     // the panorama; the embed if the API fails to load
      frame.hidden = true;
      panoAt(lat, lng, u.searchParams.get("heading") || 0).catch(() => {
        frame.src = embed(lat, lng, u.searchParams.get("heading") || 0); frame.hidden = false; pdiv.hidden = true; empty.hidden = true; });
      return;
    }
    frame.src = embed(lat, lng, u.searchParams.get("heading") || 0);
    frame.hidden = false; empty.hidden = true; document.getElementById("sv-pano").hidden = true;
  }

  // the divider (resizable=False removes it): the panel width follows the pointer, 20%..80% of
  // the window, and is remembered in this browser
  const KEY = "rs-street-view-width" + (below ? "-below" : ""), drag = document.getElementById("sv-drag");
  if (drag) {
  const setW = pct => {
    pct = Math.min(80, Math.max(20, pct));
    document.body.style.setProperty("--sv-w", pct + "%"); map.resize(); return pct;
  };
  try { const w = parseFloat(localStorage.getItem(KEY)); if (w) setW(w); } catch (err) {}
  drag.addEventListener("pointerdown", e => {
    drag.setPointerCapture(e.pointerId); document.body.classList.add("sv-dragging");
  });
  drag.addEventListener("pointermove", e => {
    if (drag.hasPointerCapture(e.pointerId))
      setW((1 - (below ? e.clientY / window.innerHeight : e.clientX / window.innerWidth)) * 100);
  });
  drag.addEventListener("pointerup", e => {
    drag.releasePointerCapture(e.pointerId); document.body.classList.remove("sv-dragging");
    const w = parseFloat(document.body.style.getPropertyValue("--sv-w"));
    try { if (w) localStorage.setItem(KEY, w); } catch (err) {}
  });
  }

  map.resize();                                          // #map just gave up part of the page
})();
</script>
