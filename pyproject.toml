[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roadstyle"
version = "0.10.0"
description = "Road cartography for Python: turn road edges into styled, interactive, offline HTML maps (MapLibre) with a JavaScript API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kaveh" }]
keywords = [
    "openstreetmap", "osm", "roads", "cartography", "map", "visualization",
    "folium", "lonboard", "geopandas", "leaflet", "maplibre",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "geopandas",
    "shapely",
    "folium",
    "branca",
]

[project.optional-dependencies]
numeric = ["mapclassify", "matplotlib"]   # numeric/continuous styling: classification + colormaps
basemaps = ["xyzservices"]                # use any XYZ tile provider as a base map
lonboard = ["lonboard"]                   # WebGL (deck.gl) backend for very large edge sets
duckdb = ["duckdb"]                        # read edges straight from a DuckDB relation / query
arrow = ["pyarrow"]                        # read edges from a pyarrow Table
tiles = ["mapbox-vector-tile", "pmtiles"]  # tiles=True: embedded-PMTiles vector road tiles
studio = ["streamlit"]                     # the `roadstyle studio` Streamlit workbench
mcp = ["mcp>=2.2,<3", "osmnx", "playwright"]  # `roadstyle-mcp`: tools for AI agents (+ playwright install chromium)
all = ["roadstyle[numeric,basemaps,lonboard,duckdb,arrow,tiles,studio]"]  # every user-facing extra
docs = ["mkdocs-material", "mkdocs-redirects"]
dev = ["roadstyle[all]", "pytest", "ruff", "mypy"]  # everything a user can get + test/lint tools

[project.scripts]
roadstyle = "roadstyle.cli:main"
roadstyle-mcp = "roadstyle.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Khoshkhah/roadstyle"
Documentation = "https://khoshkhah.github.io/roadstyle/"
Source = "https://github.com/Khoshkhah/roadstyle"
Changelog = "https://github.com/Khoshkhah/roadstyle/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roadstyle = [
    "py.typed", "static/*.js", "static/*.css", "static/*.html", "vendor/*.js", "vendor/*.css",
    "templates/*.html",                       # bundled dashboard/report sidebars (see pages.py)
    "data/*.json", "data/palettes/*.json",   # bundled palettes + style config (see _settings.py)
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: comment/docstring overruns a few chars past 100 — tolerated house style.
# E741: `l` for a layer/line is idiomatic throughout.
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
# The annotation/deck walkers define closures that are consumed inside the same loop
# iteration (verified byte-identical output); the rule can't see that.
"src/roadstyle/render_web.py" = ["B023"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
