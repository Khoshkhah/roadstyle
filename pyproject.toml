[build-system]
# one wheel with the Rust engine in it (docs/design/rust_library.md, decision 5): the module roadstyle._rust (rust/roadstyle-py, abi3)
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "roadstyle"
version = "0.25.0"
description = "Road cartography for Python: turn road edges into styled, interactive, offline HTML maps (MapLibre) with a JavaScript API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kaveh" }]
keywords = [
    "openstreetmap", "osm", "roads", "cartography", "map", "visualization",
    "folium", "lonboard", "geopandas", "leaflet", "maplibre",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "geopandas",
    "shapely",
    "folium",
    "branca",                    # folium's page elements (MacroElement); the colour ramps are data/cmaps.json
    "pyyaml",                    # settings files in YAML (settings= takes a dict, a JSON file or a YAML file)
    "scipy",                     # the drawing order of every edge (compute_levels): stages 1-3, a sparse linear program (HiGHS)
    "ortools",                   # stage 0 of it, as a minimum-cost flow
    "pyarrow",                   # a level area's roads.parquet (roadstyle-levels make / solve / edit)
]

[project.optional-dependencies]
numeric = ["mapclassify"]                 # numeric styling: the class breaks (the colormaps are data/cmaps.json)
basemaps = ["xyzservices"]                # use any XYZ tile provider as a base map
lonboard = ["lonboard"]                   # WebGL (deck.gl) backend for very large edge sets
duckdb = ["duckdb"]                        # read edges straight from a DuckDB relation / query
arrow = ["pyarrow"]                        # read edges from a pyarrow Table
studio = ["streamlit"]                     # the `roadstyle studio` Streamlit workbench
mcp = ["mcp>=2.2,<3", "osmnx", "playwright"]  # `roadstyle-mcp`: tools for AI agents (+ playwright install chromium)
all = ["roadstyle[numeric,basemaps,lonboard,duckdb,arrow,studio]"]  # every user-facing extra
docs = ["mkdocs-material", "mkdocs-redirects"]
dev = ["roadstyle[all]", "pytest", "ruff", "mypy"]  # everything a user can get + test/lint tools

[project.scripts]
roadstyle = "roadstyle.cli:main"
roadstyle-mcp = "roadstyle.mcp_server:main"
roadstyle-levels = "roadstyle.level_area:main"

[project.urls]
Homepage = "https://github.com/Khoshkhah/roadstyle"
Documentation = "https://khoshkhah.github.io/roadstyle/"
Source = "https://github.com/Khoshkhah/roadstyle"
Changelog = "https://github.com/Khoshkhah/roadstyle/blob/main/CHANGELOG.md"

[tool.maturin]
python-source = "src"
module-name = "roadstyle._rust"
manifest-path = "rust/roadstyle-py/Cargo.toml"
# the package's files are the Python files and folium's static/roadstyle.{js,css}. The look, the base map, the dashboard, the templates
# and MapLibre are in the module (roadstyle-assets; Python asks _assets). Not in the wheel: a development build of the module
# (rust/roadstyle-py/build.py), and the generated copy of the old paths for duckosm-rust (rust/roadstyle-assets/sync_old_paths.py)
exclude = ["src/roadstyle/_rust.abi3.so", "src/roadstyle/**/__pycache__/**", "src/roadstyle/static/dashboard/**",
           "src/roadstyle/static/popup.css", "src/roadstyle/static/popup.js", "src/roadstyle/static/level_editor.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: comment/docstring overruns a few chars past 100 — tolerated house style.
# E741: `l` for a layer/line is idiomatic throughout.
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
# The annotation/deck walkers define closures that are consumed inside the same loop
# iteration (verified byte-identical output); the rule can't see that.
"src/roadstyle/render_web.py" = ["B023"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
