name: Rust

# The Rust engine in rust/ (docs/design/rust_library.md, P0): the tests against Python's goldens, clippy, and the WebAssembly build.
# The large goldens come from the pre-release rust-test-data (rust/roadstyle-rs/tests/get_goldens.sh).
on:
  push:
    branches: [main, rust-engine, "design-*"]
    paths: ["rust/**", "src/roadstyle/**", "tests/test_engine_parity.py", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "src/roadstyle/**", "tests/test_engine_parity.py", ".github/workflows/rust.yml"]
  schedule:
    - cron: "17 3 * * *"          # each night: the Tartu goldens too
  workflow_dispatch:

env:
  RUST: "1.99.1"                  # the version the goldens were checked with (rustc --version)
  CARGO_BUILD_JOBS: "4"

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install "$RUST" --profile minimal --component clippy --target wasm32-unknown-unknown
          rustup default "$RUST"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ env.RUST }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Fetch the crates and the goldens
        run: |
          cargo fetch --locked
          roadstyle-rs/tests/get_goldens.sh

      - name: Tests
        # release for the speed of the goldens, with the overflow checks of a debug build (pmtiles.rs's overflow, 2026-10-24, panicked
        # only in debug)
        env:
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
        run: cargo test --offline --release

      - name: Clippy
        run: cargo clippy --offline --all-targets -- -D warnings

      - name: Long files (a warning, not a failure)
        run: python3 ../docs/gen_architecture.py --long

      - name: WebAssembly
        run: |
          cargo build --offline --release --target wasm32-unknown-unknown -p roadstyle-wasm
          ls -l target/wasm32-unknown-unknown/release/roadstyle_wasm.wasm
          # the core builds for wasm32 with no features, and it has no I/O (the Arrow arrays are the model's data, the Parquet reader is I/O) (docs/design/rust_library.md, rule 3 of the layers)
          core="-p roadstyle-model -p roadstyle-levels -p roadstyle-engine -p roadstyle-tiles"
          cargo build --offline --release --target wasm32-unknown-unknown $core --no-default-features
          cargo build --offline --release --target wasm32-unknown-unknown -p roadstyle --no-default-features
          io=$(cargo tree --offline -e normal --prefix none $core | grep -E '^(roadstyle-io|parquet) ' || true)
          if [ -n "$io" ]; then echo "the core depends on a reader: $io"; exit 1; fi

  python:
    # the Python binding (phase P5): build roadstyle._rust and check that the two engines give the same style
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Toolchain
        run: |
          rustup toolchain install "$RUST" --profile minimal --component clippy
          rustup default "$RUST"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-py-${{ env.RUST }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Install roadstyle (maturin builds the extension roadstyle._rust) and a headless Chromium for the browser tests
        run: |
          pip install -e ".[dev]" playwright
          playwright install --with-deps chromium

      - name: Clippy of the binding
        run: |
          (cd rust && cargo fetch --locked)
          (cd rust && cargo clippy --offline -p roadstyle-py -- -D warnings)

      - name: The two engines
        run: pytest -q tests/test_engine_parity.py

      - name: The whole suite with the Rust engine as the default, with the browser tests (docs/design/rust_library.md, P5's golden test)
        run: ROADSTYLE_ENGINE=rust pytest -q

  tartu:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install "$RUST" --profile minimal
          rustup default "$RUST"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ env.RUST }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Fetch the crates and the goldens
        run: |
          cargo fetch --locked
          roadstyle-rs/tests/get_goldens.sh

      - name: The ignored goldens (Tartu)
        run: cargo test --offline --release -- --ignored
