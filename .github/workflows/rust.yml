name: Rust

# The Rust engine in rust/ (docs/design/rust_library.md, P0): the tests against Python's goldens, clippy, and the WebAssembly build.
# The large goldens come from the pre-release rust-test-data (rust/roadstyle-rs/tests/get_goldens.sh).
on:
  push:
    branches: [main, rust-engine, "design-*"]
    paths: ["rust/**", "src/roadstyle/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "src/roadstyle/**", ".github/workflows/rust.yml"]
  schedule:
    - cron: "17 3 * * *"          # each night: the Tartu goldens too
  workflow_dispatch:

env:
  RUST: "1.99.1"                  # the version the goldens were checked with (rustc --version)
  CARGO_BUILD_JOBS: "4"

# a new push to a branch cancels its older runs (the runners are shared)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: No Python design in the Rust crates (docs/design/python_shape_left.md)
        run: python3 scripts/check_no_python_shape.py
        working-directory: .

      - name: Toolchain
        run: |
          rustup toolchain install "$RUST" --profile minimal --component clippy --target wasm32-unknown-unknown
          rustup default "$RUST"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ env.RUST }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Fetch the crates and the goldens
        run: |
          cargo fetch --locked
          roadstyle-rs/tests/get_goldens.sh

      - name: Tests
        # release for the speed of the goldens, with the overflow checks and the debug_assert! of a debug build (pmtiles.rs's overflow,
        # 2026-10-24, panicked only in debug)
        env:
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
        run: cargo test --offline --release

      - name: The keys of the tiles of every path (the table is in the job summary; docs/design/tiling.md)
        env:
          ROADSTYLE_TILE_KEYS_OUT: ${{ github.step_summary }}
        run: cargo test --offline --release -p roadstyle-rs --test tile_keys -- --nocapture

      - name: The programs (roadstyle-cli, roadstyle-mcp and roadstyle-snapshot are not default members)
        env:
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
        run: cargo test --offline --release -p roadstyle-cli -p roadstyle-mcp -p roadstyle-snapshot

      - name: Clippy
        run: cargo clippy --offline --workspace --exclude roadstyle-py --all-targets -- -D warnings

      - name: Long files (a warning, not a failure)
        run: python3 ../docs/gen_architecture.py --long

      - name: WebAssembly
        run: |
          cargo build --offline --profile dist --target wasm32-unknown-unknown -p roadstyle-wasm
          ls -l target/wasm32-unknown-unknown/dist/roadstyle_wasm.wasm
          # the core builds for wasm32 with no features, and it has no I/O (the Arrow arrays are the model's data, the Parquet reader is I/O) (docs/design/rust_library.md, rule 3 of the layers)
          core="-p roadstyle-model -p roadstyle-levels -p roadstyle-engine -p roadstyle-tiles"
          cargo build --offline --release --target wasm32-unknown-unknown $core --no-default-features
          cargo build --offline --release --target wasm32-unknown-unknown -p roadstyle --no-default-features
          io=$(cargo tree --offline -e normal --prefix none $core | grep -E '^(roadstyle-io|parquet) ' || true)
          if [ -n "$io" ]; then echo "the core depends on a reader: $io"; exit 1; fi
          # the levels are a leaf (N26): duckosm-rust takes them alone, with rstar and sha2 only (no Arrow, no other roadstyle crate)
          leaf=$(cargo tree --offline -e normal --depth 1 --prefix none -p roadstyle-levels | tail -n +2 | grep -vE '^(rstar|sha2) ' || true)
          if [ -n "$leaf" ]; then echo "roadstyle-levels depends on more than rstar and sha2: $leaf"; exit 1; fi
          # GeoPackage (rusqlite, SQLite in C) is for the native programs only: the browser package must not have it
          if cargo tree --offline --target wasm32-unknown-unknown -e normal -p roadstyle-wasm -i rusqlite >/dev/null 2>&1; then echo "roadstyle-wasm depends on rusqlite (the gpkg feature)"; exit 1; fi

      - name: Cross-language (the wasm package in Node gives the native golden's hashes; tests/test_binding.py checks Python)
        run: |
          # the wasm-bindgen program of the version in Cargo.lock (its prebuilt release), on the dist build of the step before
          v=$(grep -m1 -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$v/wasm-bindgen-$v-x86_64-unknown-linux-musl.tar.gz" | tar xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/wasm-bindgen-$v-x86_64-unknown-linux-musl/wasm-bindgen" --target web --out-dir target/cross-pkg target/wasm32-unknown-unknown/dist/roadstyle_wasm.wasm
          node roadstyle-wasm/cross_language.mjs target/cross-pkg/roadstyle_wasm.js

  python:
    # the Python binding (phase P5): build roadstyle._rust and run the Python suite on it
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Toolchain
        run: |
          rustup toolchain install "$RUST" --profile minimal --component clippy
          rustup default "$RUST"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-py-${{ env.RUST }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Install roadstyle (maturin builds the extension roadstyle._rust) and a headless Chromium for the browser tests
        run: |
          pip install -e ".[dev]" playwright
          playwright install --with-deps chromium

      - name: Clippy of the binding
        run: |
          (cd rust && cargo fetch --locked)
          (cd rust && cargo clippy --offline -p roadstyle-py -- -D warnings)

      - name: The whole suite, with the browser tests (docs/design/rust_library.md, P5's golden test)
        run: pytest -q

  tartu:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install "$RUST" --profile minimal
          rustup default "$RUST"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ env.RUST }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Fetch the crates and the goldens
        run: |
          cargo fetch --locked
          roadstyle-rs/tests/get_goldens.sh

      - name: The ignored goldens (Tartu)
        env:
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
        run: cargo test --offline --release -- --ignored
