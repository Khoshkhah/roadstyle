name: Release to PyPI

# Publish on a version tag (v0.2.0, …) via PyPI trusted publishing — no API token stored.
# One-time setup on pypi.org: add a "trusted publisher" for this repo/workflow
# (project: roadstyle, owner: Khoshkhah, workflow: release.yml, environment: pypi), and the same
# for the project roadstyle-mcp (packages/roadstyle-mcp, released with roadstyle).
# Then the MCP server is listed in the MCP Registry (server.json) via GitHub OIDC.
# A release branch (release-* or release/*) and a run by hand build the wheels and the sdist only, to check them before the tag.
on:
  push:
    tags: ["v*"]
    branches: ["release-*", "release/*"]
  workflow_dispatch:

jobs:
  # one roadstyle wheel with the Rust engine in it for each platform (abi3: one wheel for every Python from 3.10), and the sdist
  # (docs/design/rust_library.md, decision 5)
  wheels:
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64}
          - {os: ubuntu-latest, target: aarch64}
          - {os: macos-latest, target: x86_64}
          - {os: macos-latest, target: aarch64}
          - {os: windows-latest, target: x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/

  # the Rust roadstyle-mcp as a wheel (rust/roadstyle-mcp/pyproject.toml, maturin bindings = "bin"), on the targets of the roadstyle wheel.
  # Built and tested here, NOT published: packages/roadstyle-mcp (the Python server) stays roadstyle-mcp on PyPI until render_place is
  # in Rust (docs/design/rust_library.md, A2). The artifacts are mcp-wheel-*, which the publish job does not download.
  mcp-wheels:
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64}
          - {os: ubuntu-latest, target: aarch64}
          - {os: macos-latest, target: x86_64}
          - {os: macos-latest, target: aarch64}
          - {os: windows-latest, target: x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m rust/roadstyle-mcp/Cargo.toml
          manylinux: auto

      - uses: actions/upload-artifact@v4
        with:
          name: mcp-wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/

  # the wheel as an MCP client starts it: uvx --from <wheel> roadstyle-mcp, then initialize, tools/list and one render_file on Monaco
  mcp-wheel-test:
    needs: mcp-wheels
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, artifact: mcp-wheel-ubuntu-latest-x86_64}
          - {os: macos-latest, artifact: mcp-wheel-macos-latest-aarch64}
          - {os: windows-latest, artifact: mcp-wheel-windows-latest-x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

      - uses: astral-sh/setup-uv@v6

      - name: uvx --from <wheel> roadstyle-mcp, over stdio
        shell: bash
        run: python3 rust/roadstyle-mcp/tests/wheel_check.py dist/*.whl rust/roadstyle-rs/tests/data/monaco/roads.parquet

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: roadstyle-mcp (pure Python, released with roadstyle)
        run: |
          pip install build
          python -m build packages/roadstyle-mcp --outdir dist/

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/

  publish:
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')      # only a version tag publishes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write   # OIDC token for trusted publishing
    steps:
      # roadstyle's wheels and the sdist (with packages/roadstyle-mcp), not the Rust roadstyle-mcp wheels (mcp-wheel-*: not published yet)
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write   # OIDC login to the MCP Registry as io.github.Khoshkhah
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Wait for roadstyle-mcp on PyPI
        # the registry checks the PyPI description for "mcp-name: io.github.Khoshkhah/roadstyle"
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/roadstyle-mcp/$v/json" >/dev/null && exit 0
            sleep 20
          done
          echo "roadstyle-mcp $v never appeared on PyPI" && exit 1

      - name: Publish server.json
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
