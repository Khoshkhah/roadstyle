name: Deploy docs

# Build the MkDocs (Material) site and publish it to GitHub Pages via the
# GitHub Actions deployment (no gh-pages branch). Runs only when something that
# affects the docs changes on main, plus a manual trigger.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/roadstyle/**"
      - "rust/**"                          # the live parts (docs/copy_parts.py) are rust/roadstyle-assets/files; the live editors run the engine
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Least privilege: read the repo, write Pages, mint the OIDC token deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; never cancel a publish already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python (with pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install docs dependencies
        run: pip install mkdocs-material mkdocs-redirects "."

      # The Manual's live maps (docs/maps/*.html) are built here, not committed: CARTO tiles
      # need a key, which lives in the repo secret CARTO_API_KEY. It is not in git, but it is
      # in the deployed pages (browsers send it with each tile request) - restrict the key
      # to khoshkhah.github.io in the CARTO dashboard.
      # The Google Maps JavaScript API key (repo secret GOOGLE_MAPS_KEY) is in the pages the same
      # way: the live map's Google 3D window and the Street View windows' Linked mode use it. Limit
      # it to https://khoshkhah.github.io/roadstyle/* and to the Maps JavaScript API
      # (docs/guides/google-key.md).
      - name: Build the live maps
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: |
          test -n "$CARTO_API_KEY" || { echo "::error::repo secret CARTO_API_KEY is not set"; exit 1; }
          test -n "$GOOGLE_MAPS_KEY" || { echo "::error::repo secret GOOGLE_MAPS_KEY is not set"; exit 1; }
          python docs/build_maps.py

      # The live editors of the Manual (Edit design, Edit levels: site/live/, docs/copy_parts.py) run the engine in the page: the
      # WebAssembly package of rust/roadstyle-wasm/build_editor.sh, with the toolchain and the wasm-bindgen program of the Rust CI (rust.yml).
      - name: Rust toolchain for the WebAssembly package
        run: |
          rustup toolchain install "1.99.1" --profile minimal --target wasm32-unknown-unknown
          rustup default "1.99.1"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: docs-wasm-1.99.1-${{ hashFiles('rust/Cargo.lock') }}
      - name: Build the WebAssembly package of the live editors
        working-directory: rust
        run: |
          cargo fetch --locked
          v=$(grep -m1 -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$v/wasm-bindgen-$v-x86_64-unknown-linux-musl.tar.gz" | tar xz -C "$RUNNER_TEMP"
          PATH="$RUNNER_TEMP/wasm-bindgen-$v-x86_64-unknown-linux-musl:$PATH" roadstyle-wasm/build_editor.sh

      # First run flips the Pages source from the gh-pages branch to GitHub
      # Actions; subsequent runs are a no-op.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build site (strict — fail on any broken link or nav reference)
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30          # Pages can copy the site files for more than 10 minutes (2026-11-07); the step's own limit is 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1500000           # ms: Pages copied the files for more than the default 10 minutes (2026-11-07)
