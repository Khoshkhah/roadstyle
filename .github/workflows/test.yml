name: Tests

on:
  push:
    branches: [main, rust-engine, "design-*"]
  pull_request:
  workflow_dispatch:

# a new push to a branch cancels its older runs (the runners are shared)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (editable + dev tools)
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: pytest -q

  # Full suite with playwright installed — runs the browser tests the matrix above skips.
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (+ headless Chromium, + mcp for the Python MCP server's tests until it retires)
        run: |
          pip install -e ".[dev]" playwright "mcp>=2.2,<3"
          playwright install --with-deps chromium firefox webkit     # Firefox and WebKit for tests/test_mlt_browsers.py

      - name: The Rust program roadstyle, for the Rust snapshot's test (tests/test_snapshot_rust.py)
        run: |
          rustup toolchain install 1.99.1 --profile minimal    # the version of the Rust workflow
          (cd rust && cargo +1.99.1 build --locked -p roadstyle-cli)

      - name: Tests (incl. browser)
        run: pytest -q
        env:
          ROADSTYLE_BIN: rust/target/debug/roadstyle

      - name: MLT tiles in Chromium, Firefox and WebKit (the skipped browsers are listed with their reason)
        run: pytest -q -rs tests/test_mlt_browsers.py
