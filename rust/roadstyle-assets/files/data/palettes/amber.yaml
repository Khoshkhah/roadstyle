# roadstyle palette 'amber': every color of a map, nothing else (docs/design/style_config.md).
# The widths, zooms, sizes and dashes are in the profile (data/profiles/). An own palette states only what it changes
# and merges over 'amber'.

classes:   # per road class: fill, casing (null = no casing), opacity
  motorway: {fill: "#f28c28", casing: "#dc2a48", opacity: 1.0}
  trunk: {fill: "#f5a623", casing: "#c84e2f", opacity: 1.0}
  primary: {fill: "#f4c542", casing: "#a06b00", opacity: 1.0}
  secondary: {fill: "#f7df72", casing: "#707d00", opacity: 1.0}
  tertiary: {fill: "#b8d986", casing: "#bcbcbc", opacity: 1.0}
  unclassified: {fill: "#ffffff", casing: "#bcbcbc", opacity: 1.0}
  residential: {fill: "#d7dee8", casing: "#bcbcbc", opacity: 1.0}
  living_street: {fill: "#cbd5e1", casing: "#cccccc", opacity: 1.0}
  service: {fill: "#94a3b8", casing: "#d4d4d4", opacity: 1.0}
  track: {fill: "#a3a3a3", casing: "#9e7b54", opacity: 1.0}
  cycleway: {fill: "#5c7cb6", casing: "#5c7cb6", opacity: 1.0}
  footway: {fill: "#C59D9D", casing: "#C59D9D", opacity: 1.0}
  path: {fill: "#C59D9D", casing: "#C59D9D", opacity: 1.0}
roads: {fallback: {"fill": "#888888", "casing": "#000000", "palette_casing": "#bcbcbc"}, fill_opacity: 0.9}
casing: {opacity: 0.75}
labels: {color: "#5b5b5b", halo_color: null}
arrows: {color: "#5b5b5b", opacity: 0.7}
bridges: {casing_color: "#64748b", shadow: {"color": "rgba(0,0,0,0.25)"}, decks: {"underlay": "#f2f2f2", "opacity": 0.7}}
tunnels: {fill_dash_color: "rgba(255,255,255,0.55)", toward: "Sand", towards: {"Slate": "#64748b", "Dark": "#14181d", "Light": "#efede8", "Graphite": "#374151", "Navy": "#1e293b", "Stone": "#78716c", "Sand": "#d6cfc4", "Teal": "#134e4a"}, palette: "Graphite + silver", palettes: {"One colour": null, "Slate + ice": ["#64748b", "#cbd5e1"], "Blue + cyan": ["#315b7d", "#a9d7e8"], "Warm + sand": ["#806d64", "#e7c9a7"], "Graphite + silver": ["#4b5563", "#b8bec7"], "Indigo + lavender": ["#4c5c96", "#b9c2ea"], "Teal + mint": ["#2f6f73", "#9fd3cf"]}, to: {"fill": "#64748b", "dash": "#94a3b8"}}
selection: {hover: "#b388ff", select: "#7c4dff", casing: "#000000", opacity: 0.85, glow_opacity: 0.35, folium_hover: "#ffffff"}
data: {nodata: "#cccccc", color_table: "#bbbbbb", live_ramp: ["#3b82f6", "#06b6d4", "#22c55e", "#eab308", "#f97316", "#ef4444", "#be123c"], opacity: 0.9, casing_opacity: 0.75}
overlays: {color: "#6aa9ff", circle_stroke: "#ffffff", fill_opacity: 0.15, circle_opacity: 0.85, line_opacity: 0.9, outline_opacity: 0.9}
boundary: {color: "#6a0dad", opacity: 0.9}
dock:   # the data dock's objects on the map, light and dark (docs/design/dock_kinds_table_views.md): the result, the selected object, and one colour for each role of a part
  result: {light: "#2563eb", dark: "#5aa9f8"}
  selected: "#7c4dff"
  roles:
    from: {light: "#16a34a", dark: "#4ade80"}
    via: {light: "#d97706", dark: "#fbbf24"}
    to: {light: "#e11d48", dark: "#fb7185"}
  role_series: [{light: "#0d9488", dark: "#2dd4bf"}, {light: "#db2777", dark: "#f472b6"}, {light: "#65a30d", dark: "#a3e635"}, {light: "#9333ea", dark: "#c084fc"}]
vehicles:   # the vehicles of a traffic microsimulation run (docs/design/vehicles_spec.md), light and dark: one colour for each kind; the profile's vehicles.classes give each SUMO vClass its kind
  colours:
    car: {light: "#e63946", dark: "#ff6b6b"}
    bus: {light: "#1d4ed8", dark: "#60a5fa"}
    truck: {light: "#b45309", dark: "#fbbf24"}
    two_wheel: {light: "#7c3aed", dark: "#c4b5fd"}
    rail: {light: "#0f766e", dark: "#5eead4"}
    special: {light: "#be185d", dark: "#f9a8d4"}
background: {light: "#e8e6e1", dark: "#0e1113"}
access: {private: "#c8c8c8", bus: "#9db8d9", pedestrian: "#dddde8", delivery: "#e8d2b0"}     # access_col: the fill of a road that no mode may use
