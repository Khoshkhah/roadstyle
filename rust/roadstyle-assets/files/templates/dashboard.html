<!-- roadstyle UI template: the dashboard's panel (it starts empty: the page adds its sections, docs/guides/dashboard-panel.md).
     A plain HTML/CSS/JS fragment injected at the end of any saved roadstyle web map.
     It talks to the map ONLY through the public window.rs* API and rs:* events, so every
     piece is safe to rip out, restyle, or extend. Uses the shared design tokens
     (--bg / --ink / --mut / --line / --card / --accent + a light/dark toggle). Build:  python build.py  -->
<style>
#map{right:var(--rs-panel-w,400px)}
body{--rs-side:var(--rs-panel-w,400px)}   /* shift the map's right-anchored controls left of the panel */
.co-ctrl,.co-lg{display:none}  /* the toolbox has the colour and the legend: no floating copies */
#sb label{display:block;margin:11px 0 3px;font-weight:600;font-size:11px;color:var(--mut);
  text-transform:uppercase;letter-spacing:.04em}
#sb select{width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid var(--line);
  border-radius:5px;background:var(--bg);color:var(--ink);font:inherit;outline:none}
#sb select:focus{border-color:var(--accent)}
#sb button{padding:5px 11px;border:1px solid var(--line);border-radius:6px;
  background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
#sb button:is(:hover,:focus-visible):not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--rs-hover-bg)}
</style>
<div id="sb" data-theme="light">
<div class="sb-card">
  <div class="sb-top"><h2>Dashboard</h2>
    <span><button id="sb-th" title="Light / dark">◐</button><button id="sb-hide" title="Hide panel"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M15 4v16"/><path d="m8.5 9.5 2.5 2.5-2.5 2.5"/></svg></button></span></div>
<div class="sb-body"></div>
</div>
</div>
<button id="sb-show" title="Show panel"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M15 4v16"/><path d="m10.5 9.5-2.5 2.5 2.5 2.5"/></svg></button>
<script>
// ── panel chrome: light/dark toggle + hide/show (the map takes the space back) ──
const sb = document.getElementById("sb");
document.getElementById("sb-th").onclick = () => sb.dataset.theme = sb.dataset.theme === "dark" ? "light" : "dark";
function panel(show){
  sb.classList.toggle("hidden", !show);
  document.getElementById("sb-show").style.display = show ? "none" : "flex";
  const mp = document.getElementById("map"); if (mp) mp.style.right = show ? "var(--rs-panel-w,400px)" : "0";
  document.body.style.setProperty("--rs-side", show ? "var(--rs-panel-w,400px)" : "0px");
  try { map.resize(); } catch (e) {}
}
document.getElementById("sb-hide").onclick = () => panel(false);
document.getElementById("sb-show").onclick = () => panel(true);

</script>
