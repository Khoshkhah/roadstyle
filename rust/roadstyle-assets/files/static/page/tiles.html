<script>
(function(){
  var b=atob("__RS_PMTILES_B64__"), arr=new Uint8Array(b.length);
  for(var i=0;i<b.length;i++) arr[i]=b.charCodeAt(i);
  // the archive is one gzip stream (its tiles are not gzipped one by one: the stream is a fifth smaller); a read waits for it
  var ready=new Response(new Blob([arr]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
  var src={getKey:function(){return "roads";},
           getBytes:function(o,l){return ready.then(function(buf){return {data:buf.slice(o,o+l)};});}};
  var proto=new pmtiles.Protocol(), archive=new pmtiles.PMTiles(src);
  proto.add(archive);
  maplibregl.addProtocol("pmtiles", proto.tile);
  window.__rs_tiles={ok:true, bytes:arr.length};
  // the generation of the road set in the archive's metadata: the dashboard compares it with the style's (generation.js)
  archive.getMetadata().then(function(m){
    window.__rs_tiles.generation=(m && m.generation) || null;
    document.dispatchEvent(new CustomEvent("rs:tiles-generation", {detail: window.__rs_tiles.generation}));
  });
})();
</script>
