<script>
(function(){
  // the archives by source: `roads` and one for each overlay (docs/design/tiling.md). Each is one gzip stream (its tiles are not gzipped one by
  // one: the stream is a fifth smaller), inflated at its first read: an overlay's archive when the overlay first shows; a read waits for it
  // An archive is base64 in the page, or {url} (lazy_overlays=True): a PMTiles file next to the page, of which MapLibre reads only the tiles of the
  // view (HTTP range requests), and only while the overlay shows
  var all=__RS_PMTILES__, proto=new pmtiles.Protocol(), roads=null;
  function archive(name){
    if(typeof all[name]!=="string"){
      var fs=new pmtiles.FetchSource(all[name].url);
      // Chrome locks its HTTP cache for each URL, so range reads of one file wait for each other (one round trip for each tile). pmtiles
      // turns the cache off for this only on Windows; Chrome on Linux and macOS has the same lock
      fs.chromeWindowsNoCache=/Chrome|Chromium|Edg|OPR|Brave/.test(navigator.userAgent);
      var f=new pmtiles.PMTiles({getKey:function(){return name;}, getBytes:fs.getBytes.bind(fs)});
      proto.add(f);
      return f;
    }
    var ready=null;
    function inflate(){
      if(!ready){
        var b=atob(all[name]), arr=new Uint8Array(b.length);
        for(var i=0;i<b.length;i++) arr[i]=b.charCodeAt(i);
        all[name]=null;
        ready=new Response(new Blob([arr]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
      }
      return ready;
    }
    var a=new pmtiles.PMTiles({getKey:function(){return name;},
                               getBytes:function(o,l){return inflate().then(function(buf){return {data:buf.slice(o,o+l)};});}});
    proto.add(a);
    return a;
  }
  var bytes=typeof all.roads==="string" ? Math.floor(all.roads.length*3/4) : 0;
  Object.keys(all).forEach(function(name){ var a=archive(name); if(name==="roads") roads=a; });
  maplibregl.addProtocol("pmtiles", proto.tile);
  window.__rs_tiles={ok:true, bytes:bytes, archives:Object.keys(all)};
  // the generation of the road set in the archive's metadata: the dashboard compares it with the style's (generation.js)
  if(roads) roads.getMetadata().then(function(m){
    window.__rs_tiles.generation=(m && m.generation) || null;
    document.dispatchEvent(new CustomEvent("rs:tiles-generation", {detail: window.__rs_tiles.generation}));
  });
})();
</script>
