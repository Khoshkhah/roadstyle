# roadstyle as a Rust library (docs/design/rust_library.md, "The crates"): the pure core (model, levels, engine, tiles), the
# adapters (io, wasm) and the facade `roadstyle`. `roadstyle-rs` is the old name of the facade, kept for one version.
[workspace]
members = ["roadstyle-model", "roadstyle-io", "roadstyle-levels", "roadstyle-engine", "roadstyle-tiles", "roadstyle",
           "roadstyle-rs", "roadstyle-wasm"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
# the versions of duckosm-rust (offline from the same cache); snap, not zstd: GeoPandas writes Snappy, and snap is pure Rust (wasm)
parquet = { version = "=60.0.0", default-features = false, features = ["arrow", "snap"] }
arrow-array = "=60.0.0"
arrow-schema = "=60.0.0"
bytes = "1"
indexmap = "2"                      # the order of Python's dicts (the slots' groups)
rstar = "0.12"                      # the R-tree for the crossings (shapely STRtree) and the levels
sha2 = "0.10"                       # edge_levels_meta.edge_hash: roadstyle's sha256 of the sorted edge ids
yaml-rust2 = "0.13"                 # the look: roadstyle's profiles and palettes (src/roadstyle/data/*.yaml)
base64 = "0.22"                     # the look: the arrow image as a data URL
roadstyle-model = { path = "roadstyle-model" }
roadstyle-io = { path = "roadstyle-io" }
roadstyle-levels = { path = "roadstyle-levels" }
roadstyle-engine = { path = "roadstyle-engine" }
roadstyle-tiles = { path = "roadstyle-tiles" }
roadstyle = { path = "roadstyle" }

[profile.release]
lto = true
codegen-units = 1
