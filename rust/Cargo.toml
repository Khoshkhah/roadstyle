# roadstyle as a Rust library (docs/design/rust_library.md, "The crates"): the pure core (model, look, levels, engine, tiles), the
# adapters (io, wasm) and the facade `roadstyle` and the programs (cli, mcp, snapshot). `roadstyle-rs` is the old name of the facade, kept for one version.
[workspace]
members = ["roadstyle-assets", "roadstyle-model", "roadstyle-look", "roadstyle-io", "roadstyle-levels", "roadstyle-engine", "roadstyle-tiles", "roadstyle",
           "roadstyle-rs", "roadstyle-wasm", "roadstyle-py", "roadstyle-cli", "roadstyle-mcp", "roadstyle-serve", "roadstyle-snapshot"]
# cargo test / clippy at the root: the libraries. Not the Python extension (it needs a Python to link: the CI job "python" builds it),
# and not the programs, roadstyle-cli, roadstyle-mcp and roadstyle-snapshot (bundled SQLite, headless_chrome: CI tests them in their own
# step, -p)
default-members = ["roadstyle-assets", "roadstyle-model", "roadstyle-look", "roadstyle-io", "roadstyle-levels", "roadstyle-engine", "roadstyle-tiles", "roadstyle",
                   "roadstyle-rs", "roadstyle-wasm", "roadstyle-serve"]
resolver = "2"

[workspace.package]
version = "0.26.2"
repository = "https://github.com/Khoshkhah/roadstyle"
homepage = "https://khoshkhah.github.io/roadstyle/"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = "1"                         # the JSON text of a road's cell (roadstyle-model, Cell)
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }   # float_roundtrip: parse floats exactly, as Python
# the versions of duckosm-rust (offline from the same cache); snap, not zstd: GeoPandas writes Snappy, and snap is pure Rust (wasm)
parquet = { version = "=60.0.0", default-features = false, features = ["arrow", "snap"] }
arrow-array = "=60.0.0"
arrow-schema = "=60.0.0"
arrow-select = "=60.0.0"            # the reader joins the batches of a column into one array
bytes = "1"
indexmap = "2"                      # the order of Python's dicts (the slots' groups)
rstar = "0.12"                      # the R-tree for the crossings (shapely STRtree) and the levels
sha2 = "0.10"                       # edge_levels_meta.edge_hash: roadstyle's sha256 of the sorted edge ids
yaml-rust2 = "0.13"                 # the look: roadstyle's profiles and palettes (roadstyle-assets: data/*.yaml)
base64 = "0.22"                     # the look: the arrow image as a data URL
roadstyle-assets = { path = "roadstyle-assets" }
roadstyle-model = { path = "roadstyle-model" }
roadstyle-look = { path = "roadstyle-look" }
roadstyle-io = { path = "roadstyle-io" }
roadstyle-levels = { path = "roadstyle-levels" }
roadstyle-engine = { path = "roadstyle-engine" }
roadstyle-tiles = { path = "roadstyle-tiles" }
roadstyle = { path = "roadstyle" }
roadstyle-snapshot = { path = "roadstyle-snapshot" }
roadstyle-serve = { path = "roadstyle-serve" }

# what is shipped (the wheels, the wasm packages): release with one codegen unit and fat LTO, `--profile dist`. The tests and the
# development builds use release itself, which builds much faster.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
