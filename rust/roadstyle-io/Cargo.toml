[package]
name = "roadstyle-io"
version.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
description = "roadstyle's readers: the roads and other tables from GeoParquet, GeoJSON, Shapefile and (feature gpkg) GeoPackage"

[dependencies]
roadstyle-model.workspace = true
roadstyle-levels.workspace = true      # duckosm: the hash of a map's edge ids (edge_hash), for the stored levels of one mode
serde_json.workspace = true
parquet.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
bytes.workspace = true
rstar.workspace = true              # the base map clipped to its boundary: the R-tree of the boundary's edges
i_overlay = "=9.0.1"                # the base map: the land is the boundary less the sea (duckosm::cut_sea); 9.1.0 is younger than two weeks
shapefile = "=0.9.0"                # the roads of a Shapefile (pure Rust: also in wasm)
proj4rs = { version = "=0.2.0", default-features = false }   # a road file's CRS to EPSG:4326 (pure Rust, no C proj)
proj4wkt = "=0.1.1"                 # a CRS as WKT (a .prj file, a GeoPackage definition) to a proj string
crs-definitions = { version = "=0.6.0", default-features = false, features = ["proj4"] }   # an EPSG code to a proj string
rusqlite = { version = "=0.40.2", features = ["bundled", "serialize"], optional = true }  # GeoPackage: SQLite, a C build (not in wasm)

[features]
gpkg = ["dep:rusqlite"]
