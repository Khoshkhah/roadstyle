[package]
name = "roadstyle-py"
version.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
description = "The Python binding of roadstyle's Rust engine: the module roadstyle._rust (PyO3, abi3)"

[lib]
name = "_rust"
crate-type = ["cdylib"]

[dependencies]
roadstyle.workspace = true
roadstyle-serve.workspace = true
serde_json.workspace = true
arrow-array = { workspace = true, features = ["ffi"] }   # the Arrow C stream from Python (audit R15)
pyo3 = { version = "0.30", features = ["abi3-py39", "extension-module"] }
