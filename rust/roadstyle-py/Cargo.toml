[package]
name = "roadstyle-py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Python binding of roadstyle's Rust engine: the module roadstyle._rust (PyO3, abi3)"

[lib]
name = "_rust"
crate-type = ["cdylib"]

[dependencies]
roadstyle.workspace = true
serde_json.workspace = true
pyo3 = { version = "0.30", features = ["abi3-py39", "extension-module"] }
