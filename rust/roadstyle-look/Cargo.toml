[package]
name = "roadstyle-look"
version.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
description = "roadstyle's look: the typed, versioned config (palettes, profiles, settings, map options) that the engine draws a map with"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
yaml-rust2.workspace = true
base64.workspace = true
flate2 = "1"                        # the textures of the base map: PNG images
crc32fast = "1"

[dev-dependencies]
flate2 = "1"                        # the goldens are gzipped
