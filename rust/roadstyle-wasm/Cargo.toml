[package]
name = "roadstyle-wasm"
version.workspace = true
repository.workspace = true
homepage.workspace = true
edition = "2021"
license = "MIT"
description = "The browser's front-end of roadstyle-rs: inlineStyle, Tiler, memoryBytes (docs/design/rust_engine.md)"

[lib]
crate-type = ["cdylib"]

[dependencies]
roadstyle = { path = "../roadstyle" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"           # the version of the wasm-bindgen program that makes the JavaScript glue
