[package]
name = "roadstyle"
version.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
description = "roadstyle as a Rust library: the facade over the model, the readers, the levels, the engine and the tiles"

[dependencies]
roadstyle-engine.workspace = true
roadstyle-assets.workspace = true
roadstyle-io.workspace = true
roadstyle-levels.workspace = true
roadstyle-look.workspace = true
roadstyle-model.workspace = true
roadstyle-tiles.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
base64.workspace = true
flate2 = "1"                        # the page writer: the gzipped sources

[features]
# GeoPackage: SQLite is C (rusqlite bundled), so the native programs only (the MCP server, the CLI); never in wasm (CI checks it)
gpkg = ["roadstyle-io/gpkg"]
