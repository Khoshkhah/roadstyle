[package]
name = "roadstyle-mcp"
version.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server for roadstyle: AI agents draw styled, interactive road maps of road files"

[dependencies]
roadstyle.workspace = true
roadstyle-snapshot.workspace = true
base64.workspace = true
serde_json.workspace = true
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt", "io-std"] }
serde = { workspace = true, features = ["derive"] }
schemars = "1"
strsim = "0.11"                     # "did you mean": the close option names of a misspelt one
