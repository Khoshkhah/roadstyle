[package]
name = "roadstyle-cli"
version.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
description = "The roadstyle program: one command for each job (serve: the level editor's files; snapshot: a PNG of a saved page)"

[dependencies]
roadstyle = { workspace = true, features = ["gpkg"] }   # the native program reads GeoPackage files too
serde_json.workspace = true
roadstyle-snapshot = { workspace = true, optional = true }
roadstyle-serve.workspace = true

[features]
# `roadstyle snapshot` (Chromium through headless_chrome)
default = ["snapshot"]
snapshot = ["dep:roadstyle-snapshot"]

[lib]
name = "roadstyle_cli"

[[bin]]
name = "roadstyle"
path = "src/main.rs"
