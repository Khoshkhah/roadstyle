[package]
name = "roadstyle-rs"
version.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
description = "The old name of the facade crate roadstyle, kept for one version (docs/design/rust_library.md)"

[dependencies]
roadstyle.workspace = true
serde_json.workspace = true

[dev-dependencies]
# the golden levels are duckosm-rust's own Parquet files, which it writes with zstd (only the tests read them)
parquet = { version = "=60.0.0", default-features = false, features = ["zstd"] }
sha2.workspace = true
indexmap.workspace = true
base64.workspace = true
flate2 = "1"                        # the golden styles of tests/colors.rs are gzipped
